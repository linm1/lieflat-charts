interface:
  display_name: "Navi Chart"
  short_description: "Template-driven charts and bilingual HTML reports"
  default_prompt: "Use $navi-chart to turn this data into polished HTML charts by default. Chinese output defaults to Taiwan Traditional Chinese (zh-Hant-TW) and Taiwanese wording; use Simplified Chinese only when explicitly requested. Only generate a complete bilingual-ready report when the user explicitly asks for a report, annual/monthly report, white paper, poster, brief, or similar narrative deliverable. Reuse the closest chart or report templates with one coherent color system."
